<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시율이 하루</title>
<!-- viewport-fit=cover: 시계·배터리 줄 높이(safe-area)를 알아내서 그만큼 앱을 내린다 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 검색에 나오지 않게 -->
<meta name="robots" content="noindex, nofollow">
<!-- 홈 화면에 추가하면 사파리 주소창 없이 앱처럼 열린다 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="시율이 하루">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<!-- 홈 화면 아이콘 (180x180, 아이폰이 모서리를 둥글게 깎는다) -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<script>
// 앱(Index.html)과 같은 기준으로 첫 바탕색을 정한다: 22시~8시는 검정, 낮은 앱 낮 화면 색
// 앱 안의 ☾ 버튼 상태는 구글 쪽 저장소라 여기서 읽을 수 없다 → 앱이 준비되면 알려 주는 값으로 맞춘다
(function () {
  var h = new Date().getHours(), night = h >= 22 || h < 8;
  var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  var bg = night ? '#000000' : dark ? '#10141C' : '#F2F4F8';
  document.documentElement.style.background = bg;
  // 홈 화면 앱으로 열렸는지: 아이폰은 navigator.standalone, 그 밖은 display-mode
  var app = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  document.documentElement.className = (night ? 'night' : dark ? 'dark' : 'day') + (app ? ' app' : '');
  document.write('<meta name="theme-color" content="' + bg + '">');
})();
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: inherit; font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  html.day   { --ink: #1D2433; --muted: #5B6476; --line: #CBD2DE; --field: #FFFFFF; --btn: #3D5AFE; --on-btn: #FFFFFF; --bad: #C2410C; }
  html.dark  { --ink: #E8ECF4; --muted: #98A2B3; --line: #2A3242; --field: #181E29; --btn: #8EA2F2; --on-btn: #10141C; --bad: #F59E7A; }
  html.night { --ink: #BCA383; --muted: #8F755A; --line: #261C14; --field: #110C08; --btn: #2A1A0D; --on-btn: #C9823F; --bad: #A15644; }
  /* 화면 전체를 덮는 fixed 대신 보통 배치 + 작은 뷰포트 높이(svh): 사파리 주소창·아래 막대에 가려지지 않게 */
  /* 홈 화면 앱에선 위 시계·배터리 줄과 아래 홈 막대가 화면을 덮으므로 그 높이(safe-area)만큼 비우고 그 사이에만 앱을 둔다 */
  #app { display: block; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .25s;
         margin-top: var(--top);
         height: calc(100svh - var(--top) - env(safe-area-inset-bottom, 0px)); }
  /* 아이폰(iOS 26)은 시계 줄 아래 일정 높이를 흐리게 덮는다 → 홈 화면 앱일 때만 20px 더 내려, 맨 위에 있을 때 제목이 흐림 띠 밖에 오게 */
  :root { --top: env(safe-area-inset-top, 0px); }
  html.app { --top: calc(env(safe-area-inset-top, 0px) + 20px); }
  #app.on { opacity: 1; }
  /* 입력 화면일 때 보이지 않는 빈 iframe이 위를 덮어 입력이 막히지 않게 */
  #app[hidden] { display: none; }
  #setup { z-index: 1; }
  #wait { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
          color: var(--muted); text-align: center; padding: 24px; }
  /* 지난번 앱이 알려 준 마지막 수유 (앱이 뜨기 전 2~3초 동안 바로 보이게). 화면 한가운데에 인사처럼.
     아이폰 홈 화면 앱은 막 켜질 때 화면 높이(100%·lvh 모두)를 실제와 다르게 알려 줘서 CSS 가운데 정렬이 아래로 쏠린다
     → 위에서부터 놓고, 위 여백은 아래 placeSnap() 이 기기 화면 높이(screen.height)로 계산한다 */
  #wait.snap { justify-content: flex-start; padding-top: 0; }
  #snapHi { font-size: 17px; color: var(--ink); margin-bottom: 14px; letter-spacing: .02em; }
  #snap { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink); margin-bottom: 18px; }
  #snap small { font-size: 14px; color: var(--muted); }
  #snapBig { font-size: 40px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  #snapMeta, #snapSleep { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #waitMsg { font-size: 14px; opacity: .8; }
  #setup { position: fixed; inset: 0; display: none; flex-direction: column; justify-content: center; gap: 14px;
           padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-left)) max(24px, env(safe-area-inset-bottom)); max-width: 440px; margin: 0 auto; color: var(--ink); }
  #setup h1 { margin: 0; font-size: 24px; font-weight: 600; }
  #setup p { margin: 0; color: var(--muted); font-size: 15px; }
  #setup textarea { font: 16px/1.4 ui-monospace, Menlo, monospace; color: var(--ink); background: var(--field); border: 1px solid var(--line);
                    border-radius: 12px; padding: 12px; min-height: 92px; resize: none; word-break: break-all; }
  #setup textarea:focus { outline: 2px solid var(--btn); outline-offset: 1px; }
  #setup button { font: 600 17px -apple-system, system-ui, sans-serif; border: 1px solid var(--on-btn); border-radius: 14px; padding: 14px;
                  background: var(--btn); color: var(--on-btn); }
  html.day #setup button, html.dark #setup button { border-color: transparent; }
  #bad { color: var(--bad); font-size: 14px; min-height: 21px; }
  #setup small { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="wait">
  <div id="snapHi" hidden></div>
  <div id="snap" hidden>
    <small>마지막 수유</small>
    <div id="snapBig"></div>
    <div id="snapMeta"></div>
    <div id="snapSleep" hidden></div>
  </div>
  <div id="waitMsg">불러오는 중…</div>
</div>

<!-- 처음 한 번: 앱 주소를 이 폰에만 저장한다. 이 파일(공개)에는 앱 주소가 들어 있지 않다 -->
<form id="setup" autocomplete="off">
  <h1>시율이 하루</h1>
  <p>처음 한 번만, 앱 주소를 넣어 주세요.<br>주소는 이 폰 안에만 남아요.</p>
  <textarea id="url" aria-label="앱 주소" placeholder="https://script.google.com/macros/s/…/exec" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
  <div id="bad" role="alert"></div>
  <button type="submit">저장하고 열기</button>
  <small>주소를 넣어 앱이 열린 다음 '홈 화면에 추가'를 하면, 그 아이콘은 주소를 기억해서 다음부터 바로 열려요.</small>
</form>

<iframe id="app" title="시율이 하루" allow="clipboard-write" referrerpolicy="no-referrer" hidden></iframe>

<script>
(function () {
  var KEY = 'siyul.appUrl';
  // 구글 앱 주소 모양만 받는다 (다른 사이트 주소를 넣어도 띄우지 않게)
  var OK = /^https:\/\/script\.google\.com\/macros\/s\/([A-Za-z0-9_-]{20,})\/exec$/;
  var ID = /^#([A-Za-z0-9_-]{20,})$/;
  var toUrl = function (id) { return 'https://script.google.com/macros/s/' + id + '/exec'; };
  var $ = function (id) { return document.getElementById(id); };
  var mem = null;   // 저장이 막힌 경우에도 이번 화면에서는 열리게
  var SNAP = 'siyul.snap';   // 마지막 수유·수면 시각 (이 폰에만 저장, 이 파일에는 없음)

  function load() { try { return localStorage.getItem(KEY); } catch (e) { return mem; } }
  function save(u) { mem = u; try { localStorage.setItem(KEY, u); } catch (e) { /* 이번만 열림 */ } }
  function forget() { mem = null; try { localStorage.removeItem(KEY); localStorage.removeItem(SNAP); } catch (e) { /* 무시 */ } }

  // ---- 지난번 요약: 앱이 뜨기 전에 바로 보여 준다. 경과 시간은 지금 시각으로 다시 계산 ----
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var hm = function (t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  var dur = function (ms) { var m = Math.max(0, Math.floor(ms / 60000)), h = Math.floor(m / 60); return h ? h + '시간 ' + (m % 60) + '분' : m + '분'; };
  var num = function (x) { return typeof x === 'number' && isFinite(x) && x >= 0; };
  // 앱이 보낸 값 검사: 모양이 다르면 버린다
  function cleanSnap(s) {
    if (!s || typeof s !== 'object' || !num(s.iv) || !num(s.sleep)) return null;
    var f = s.feed;
    if (f !== null && (!f || !num(f.at) || !num(f.ml) || typeof f.breast !== 'boolean')) return null;
    // start = 이번 수유를 시작한 시각(30분 안 추가 수유를 묶은 것), end = 다 먹은 시각(다음 예상 기준). 예전 앱이 보낸 값엔 없어서 at 으로 대신
    var st = f && num(f.start) && f.start <= f.at ? f.start : f ? f.at : 0;
    var en = f && num(f.end) && f.end >= f.at ? f.end : f ? f.at : 0;
    return { feed: f ? { at: f.at, start: st, end: en, ml: f.ml, breast: f.breast } : null, sleep: s.sleep, iv: s.iv, t: num(s.t) ? s.t : 0,
             birth: typeof s.birth === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s.birth) ? s.birth : '' };
  }
  function drawSnap() {
    var s = null;
    try { s = cleanSnap(JSON.parse(localStorage.getItem(SNAP))); } catch (e) { s = null; }
    if (!s || !s.feed) return;
    var now = Date.now(), at = s.feed.at, iv = s.iv * 60000;
    $('snapBig').textContent = dur(now - at) + ' 전';
    var st = s.feed.start, en = s.feed.end, what = [s.feed.ml ? s.feed.ml + 'ml' : '', s.feed.breast ? '모유' : ''].filter(Boolean).join('+');
    $('snapMeta').textContent = (st < at ? hm(st) + '~' + hm(at) : hm(at)) + ' ' + what +
      (iv ? ' · ' + (now - en > iv ? '예상 시각 ' + hm(en + iv) + ' 지남' : '다음 예상 ' + hm(en + iv)) : '');
    // 생일이 있으면 '시율이 N일째' (태어난 날 = 1일, 앱 머리글과 같은 계산)
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s.birth), t = new Date();
    var n = m ? Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - new Date(+m[1], m[2] - 1, +m[3])) / 86400000) + 1 : 0;
    $('snapHi').textContent = n > 0 ? '시율이 ' + n + '일째' : '';
    $('snapHi').hidden = !(n > 0);
    $('wait').classList.add('snap');
    $('snapSleep').hidden = !s.sleep;
    if (s.sleep) $('snapSleep').textContent = hm(s.sleep) + '부터 ' + dur(now - s.sleep) + '째 자는 중';
    $('snap').hidden = false;
    // 이 폰에서 마지막으로 받은 시각. 그 뒤 다른 폰에서 남긴 기록은 앱이 뜨면 맞춰진다
    if (s.t) $('waitMsg').textContent = hm(s.t) + '까지 받은 기록 · 새 기록 불러오는 중…';
  }

  // 주소 끝에 #다시 를 붙여 열면 저장한 주소를 지우고 다시 묻는다 (주소가 바뀌었을 때)
  if (/^#(reset|%EB%8B%A4%EC%8B%9C)$/i.test(location.hash)) { forget(); history.replaceState(null, '', location.pathname); }

  // 열 때마다 이 페이지 주소에 앱 ID를 붙여 둔다(?k=ID#ID) → 이 상태로 '홈 화면에 추가'하면 아이콘이 기억한다.
  // 아이폰이 아이콘을 만들 때 # 뒤를 버리는 경우가 있어 ?k= 에도 둔다. 파일(공개)에는 들어가지 않는다
  function open(u) {
    var id = OK.exec(u)[1];
    history.replaceState(null, '', location.pathname + '?k=' + id + '#' + id);
    $('setup').style.display = 'none';
    drawSnap();
    $('wait').style.display = 'flex';
    placeSnap();
    var f = $('app');
    f.hidden = false;
    f.src = u;
    setTimeout(show, 8000);   // 신호가 안 와도 8초 뒤에는 보여 준다
  }
  // 요약 덩어리의 가운데가 화면 위에서 28%(위쪽 1/3쯤, 폰을 들면 바로 눈이 가는 자리)에 오게 위 여백을 정한다.
  // 홈 화면 앱이면 화면 = 기기 화면 전체라 screen.height 가 켜는 순간에도 정확하다. 사파리로 열면 보이는 높이
  function placeSnap() {
    var w = $('wait');
    if (!w.classList.contains('snap')) return;
    var standalone = document.documentElement.classList.contains('app');
    var H = standalone ? screen.height : window.innerHeight;
    var kids = [$('snapHi'), $('snap'), $('waitMsg')].filter(function (e) { return !e.hidden; });
    var top = kids[0].getBoundingClientRect().top - w.getBoundingClientRect().top;
    var bottom = kids[kids.length - 1].getBoundingClientRect().bottom - w.getBoundingClientRect().top;
    var h = bottom - top;
    w.style.paddingTop = Math.max(24, Math.round(H * 0.28 - h / 2)) + 'px';
  }
  function show() { $('app').classList.add('on'); $('wait').style.display = 'none'; }

  // 앱이 "다 그렸어요" 신호를 보낼 때까지 구글 쪽 흰 화면을 가려 둔다
  addEventListener('message', function (e) {
    var host = '';
    try { host = new URL(e.origin).hostname; } catch (err) { return; }
    if (!/\.googleusercontent\.com$/.test(host)) return;
    var d = e.data;
    if (d && d.siyul === 'snap') {
      var s = cleanSnap(d.snap);
      if (s) s.t = Date.now();
      if (s) try { localStorage.setItem(SNAP, JSON.stringify(s)); } catch (err) { /* 저장 못 하면 다음에 요약 없이 열림 */ }
      return;
    }
    if (!d || d.siyul !== 'ready') return;
    if (typeof d.bg === 'string' && /^#[0-9A-Fa-f]{6}$/.test(d.bg)) document.documentElement.style.background = d.bg;
    show();
  });

  $('setup').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var u = $('url').value.replace(/\s+/g, '');
    if (!OK.test(u)) { $('bad').textContent = '앱 주소가 아니에요. script.google.com/macros/s/… /exec 주소를 통째로 넣어 주세요.'; return; }
    save(u);
    open(u);
  });

  var q = /[?&]k=([A-Za-z0-9_-]{20,})(?:&|$)/.exec(location.search);
  var fromHash = q || ID.exec(location.hash);
  var saved = fromHash ? toUrl(fromHash[1]) : load();
  if (fromHash) save(saved);
  if (saved && OK.test(saved)) open(saved);
  else $('setup').style.display = 'flex';
})();
</script>
</body>
</html>
